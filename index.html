<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>For You ♥</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}
button,input,textarea{font:inherit}
body{background:linear-gradient(160deg,#241a30,#4a2c46 55%,#7a4658);color:#fff}
.hide{display:none!important}

/* shared card look */
.card{position:relative;width:min(400px,100%);border:1px solid #ffffff22;border-radius:26px;background:#ffffff10;backdrop-filter:blur(16px);box-shadow:0 25px 70px #0006}

/* ACCESS PAGE */
#access{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#access .card{padding:44px 28px 30px;text-align:center}
.heartLogo{width:60px;height:60px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#ff9db81c;border:1px solid #ffb4cc3a;color:#ffabc6;font-size:26px}
.script{font-family:'Brush Script MT',cursive;font-size:40px;color:#ffd7e1;margin:14px 0 2px}
.sub{font-size:12px;color:#e9cdda99;margin-bottom:18px;line-height:1.6}
.input{display:flex;align-items:center;background:#00000030;border:1px solid #ffffff22;border-radius:12px;padding:0 12px;margin-top:6px}
.input input{width:100%;border:0;outline:0;background:transparent;color:#fff;padding:14px 8px;font-family:inherit}
.input input::placeholder{color:#d9c2cf99}
.input button{border:0;background:none;color:#dca9bd;cursor:pointer}
.plainBtn{width:100%;border:0;border-radius:12px;margin-top:14px;padding:13px;color:#fff;font-size:14px;letter-spacing:.3px;background:#ffffff1c;border:1px solid #ffffff30;cursor:pointer;transition:background .2s}
.plainBtn:hover{background:#ffffff2c}
.err{min-height:18px;color:#ffb2c1;font-size:12px;margin-top:8px}
.safe{font-size:10px;color:#e9d7e070;margin-top:14px}

/* CHAT PAGE */
#chat{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#chat .card{width:min(430px,100%);display:flex;flex-direction:column;height:min(88vh,720px);overflow:hidden}
.head{padding:18px 24px 14px;text-align:center;border-bottom:1px solid #ffffff18;position:relative}
.head .brand{font-family:'Brush Script MT',cursive;font-size:28px;color:#ffd7e1}
.head p{margin:4px 0 0;font-size:10px;color:#e2c6d5aa;letter-spacing:.5px}
.switchLink{position:absolute;right:18px;top:20px;font-size:10px;color:#d9b8ca;background:none;border:0;cursor:pointer;text-decoration:underline}

.msgs{flex:1;overflow-y:auto;padding:22px 18px}
.date{text-align:center;margin:0 auto 20px;width:max-content;font-size:10px;color:#d8c2d0aa}

.row{display:flex;flex-direction:column;margin-bottom:16px;max-width:78%}
.row.mine{align-self:flex-end;align-items:flex-end}
.row:not(.mine){align-self:flex-start;align-items:flex-start}
.bubble{padding:13px 16px;border-radius:18px;font-size:13px;line-height:1.6;background:linear-gradient(135deg,#e2789f,#c4667f);color:#fff2f6;box-shadow:0 6px 18px #0003;white-space:pre-wrap;word-wrap:break-word}
.row:not(.mine) .bubble{border-bottom-left-radius:5px;background:linear-gradient(135deg,#4a3350,#3a2740)}
.row.mine .bubble{border-bottom-right-radius:5px}
.name{display:block;font-size:10px;opacity:.75;margin-bottom:4px;letter-spacing:.3px}
.meta{font-size:9.5px;color:#d3b8c9aa;margin-top:4px;padding:0 4px}

.inputRow{display:flex;gap:8px;padding:14px;border-top:1px solid #ffffff18}
.inputRow input{flex:1;border:1px solid #ffffff22;background:#00000030;border-radius:20px;padding:12px 16px;color:#fff;outline:0;font-family:inherit}
.inputRow input::placeholder{color:#d9c2cf99}
.inputRow button{border:0;border-radius:20px;padding:0 18px;color:#fff;background:#ffffff1c;border:1px solid #ffffff30;cursor:pointer}
.inputRow button:hover{background:#ffffff2c}
.inputRow button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

<!-- ===================== PAGE 1: ACCESS ===================== -->
<section id="access">
  <div class="card">
    <div class="heartLogo">♥</div>
    <div class="script">For You</div>
    <div class="sub">This is just for you...<br>enter the private code to open it.</div>
    <div class="input">
      <input id="code" type="password" placeholder="Access code">
      <button id="show" type="button">◉</button>
    </div>
    <button id="open" class="plainBtn" type="button">Enter</button>
    <div id="error" class="err"></div>
    <div class="safe">🔒 Private • Just between us</div>
  </div>
</section>

<!-- ===================== PAGE 2: CHAT (confession is the first message) ===================== -->
<section id="chat" class="hide">
  <div class="card">
    <div class="head">
      <div class="brand">For You ♥</div>
      <p id="identityLabel">🔒 Just for you</p>
      <button id="switchBtn" class="switchLink" type="button">switch</button>
    </div>

    <div class="msgs" id="msgs">
      <div class="date">Today</div>
      <div class="row" id="confessionRow">
        <div class="bubble">
          <span class="name">Him</span>
          <p id="confession-p1" style="margin:0"></p>
          <p id="confession-p2" style="margin-top:8px"></p>
        </div>
      </div>
      <!-- real messages render below this point -->
    </div>

    <div class="inputRow">
      <input id="reply" type="text" placeholder="Type your reply...">
      <button id="send" type="button">Send</button>
    </div>
  </div>
</section>

<script>
/* ============================================================
   EDIT THIS SECTION — everything you need to personalize
   ============================================================ */
const CONFIG = {
  // From Supabase: Project Settings -> API
  SUPABASE_URL: "https://xvivnxzyqfxmhkylefge.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2aXZueHp5cWZ4bWhreWxlZmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjY1MTMsImV4cCI6MjEwMzA0MjUxM30.BvLjt0-Vxuff9zkH_zRcBkvLAgoeZ6VJMrn-OCXF2zk",

  // Whoever types HIM_CODE logs in as "Him". Whoever types HER_CODE logs in as "Her".
  HIM_CODE: "lil958naca",
  HER_CODE: "somethingnew",

  // The confession shown as the very first message in the chat.
  // Keep it to one or two short paragraphs.
  CONFESSION_PARAGRAPH_1: "I’ve wanted to tell you this for a while, and I finally decided to be honest about it.  𝙄 𝘼𝘿𝙊𝙍𝙀 𝙔𝙊𝙐  . We haven’t really talked much, but I’ve genuinely wanted to get to know you better, and I thought it would be better to tell you how I feel rather than keep it to myself.",
  CONFESSION_PARAGRAPH_2: "I made this little space just to confess you cause this was the only way I could talk to you. I know that you don't feel same as me but I’m saying this so I don't regret it later.You can leave your thoughts in the little text box below. I’d really love to hear what you have to say. ♥️ TAKE CARE ~ from Sadgun"
};
/* ============================================================
   END OF EDITABLE SECTION
   ============================================================ */

const $ = id => document.getElementById(id);
const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

$("confession-p1").textContent = CONFIG.CONFESSION_PARAGRAPH_1;
$("confession-p2").textContent = CONFIG.CONFESSION_PARAGRAPH_2;

function showSection(id){
  ["access","chat"].forEach(s => $(s).classList.add("hide"));
  $(id).classList.remove("hide");
}

$("show").onclick = () => { $("code").type = $("code").type === "password" ? "text" : "password"; };

// ---- identity / access ----
let identity = localStorage.getItem("identity"); // 'him' | 'her' | null
let messageChannel = null;

function attemptUnlock(){
  const val = $("code").value.trim();
  if(val === CONFIG.HIM_CODE){
    identity = "him";
  } else if(val === CONFIG.HER_CODE){
    identity = "her";
  } else {
    $("error").textContent = val ? "That code isn't right. Try again." : "Please enter the access code.";
    return;
  }
  $("error").textContent = "";
  localStorage.setItem("identity", identity);
  enterChat();
}
$("open").onclick = attemptUnlock;
$("code").onkeydown = e => { if(e.key === "Enter") attemptUnlock(); };

$("switchBtn").onclick = () => {
  localStorage.removeItem("identity");
  identity = null;
  if(messageChannel){ supabaseClient.removeChannel(messageChannel); messageChannel = null; }
  $("code").value = "";
  showSection("access");
};

// ---- chat ----
const msgsEl = $("msgs");
const confessionRow = $("confessionRow");

function otherIdentity(){ return identity === "him" ? "her" : "him"; }
function formatTime(iso){
  return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function renderMessages(rows){
  // clear everything after the confession row, keep the confession itself
  while(confessionRow.nextSibling){
    msgsEl.removeChild(confessionRow.nextSibling);
  }

  let lastOwnRow = null;
  rows.forEach(row => {
    const isOwn = row.sender === identity;
    const rowEl = document.createElement("div");
    rowEl.className = "row" + (isOwn ? " mine" : "");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const nameEl = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = row.sender === "him" ? "Him" : "Her";
    bubble.appendChild(nameEl);

    const p = document.createElement("p");
    p.style.margin = "0";
    p.textContent = row.content;
    bubble.appendChild(p);

    rowEl.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = formatTime(row.created_at);
    rowEl.appendChild(meta);

    msgsEl.appendChild(rowEl);
    if(isOwn) lastOwnRow = { rowEl, row };
  });

  if(lastOwnRow && lastOwnRow.row.seen_at){
    const seenTag = document.createElement("div");
    seenTag.className = "meta";
    seenTag.textContent = "Seen";
    lastOwnRow.rowEl.appendChild(seenTag);
  }

  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function loadMessages(){
  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .order("created_at", { ascending: true });
  if(error){ console.error(error); return; }
  renderMessages(data);
  markIncomingAsSeen(data);
}

async function markIncomingAsSeen(rows){
  const unseenIds = rows
    .filter(r => r.sender === otherIdentity() && !r.seen_at)
    .map(r => r.id);
  if(!unseenIds.length) return;
  await supabaseClient.from("messages").update({ seen_at: new Date().toISOString() }).in("id", unseenIds);
}

async function sendReply(){
  const text = $("reply").value.trim();
  if(!text) return;
  $("reply").value = "";
  $("send").disabled = true;
  const { error } = await supabaseClient.from("messages").insert({ sender: identity, content: text });
  $("send").disabled = false;
  if(error) console.error(error);
}
$("send").onclick = sendReply;
$("reply").onkeydown = e => { if(e.key === "Enter") sendReply(); };

function subscribeRealtime(){
  messageChannel = supabaseClient
    .channel("messages-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => loadMessages())
    .subscribe();
}

function enterChat(){
  $("identityLabel").textContent = identity === "him" ? "🔒 Signed in as Him" : "🔒 Signed in as Her";
  showSection("chat");
  loadMessages();
  subscribeRealtime();
}

// ---- boot ----
if(identity === "him" || identity === "her"){
  enterChat();
} else {
  showSection("access");
}
</script>
</body>
</html>
